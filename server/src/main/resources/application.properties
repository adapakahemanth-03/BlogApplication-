
# =============================================
# Neon PostgreSQL Configuration
# =============================================
# These MUST be set via environment variables or .env file.
# No sensitive defaults - the app will fail to start if these are missing.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool (HikariCP) - tuned for Neon's serverless connection limits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JWT Configuration
# =============================================
# JWT_SECRET must be set via environment variable - no default, no exposure.
jwt.secret=${JWT_SECRET}
# Safe non-sensitive default: 1 hour in milliseconds
jwt.expiration=${JWT_EXPIRATION:3600000}

# =============================================
# CORS - Frontend URL
# =============================================
# Safe non-sensitive default: local Vite dev server
app.cors.frontend-url=${FRONTEND_URL:http://localhost:5173}

# =============================================
# Actuator - Health Check (used by Docker)
# =============================================
# Expose ONLY the health endpoint — nothing else
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Default health URL: GET /actuator/health
