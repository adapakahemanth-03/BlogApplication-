# =============================================================
# BlogApplication — Docker Compose
#
# Usage:
#   1. Copy .env.example to .env and fill in real values
#   2. docker compose up --build
#   3. Open http://localhost  (nginx serves frontend + proxies /api)
# =============================================================

version: "3.9"

services:

  # -----------------------------------------------------------
  # backend: Spring Boot REST API
  # -----------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: blog_backend
    restart: unless-stopped
    environment:
      # ── Database (Neon PostgreSQL or any PostgreSQL) ──────
      SPRING_DATASOURCE_URL:      ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # ── JWT ───────────────────────────────────────────────
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}   # default: 1 hour

      # ── CORS ─────────────────────────────────────────────
      # "frontend" is the nginx service defined below.
      # Because nginx proxies /api to backend, both frontend
      # requests and backend CORS origin are on the same host.
      # In production replace with your real domain, e.g.:
      #   FRONTEND_URL=https://yourdomain.com
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

    expose:
      - "8080"          # only reachable from inside Docker network
    networks:
      - blog_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # -----------------------------------------------------------
  # frontend: nginx serving built React SPA
  #           + reverse-proxies /api/* → backend:8080
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: blog_frontend
    restart: unless-stopped
    ports:
      - "80:80"         # browser hits http://localhost (or your server IP)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blog_net

networks:
  blog_net:
    driver: bridge
